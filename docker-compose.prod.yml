services:
  backend:
    build: ./backend
    command: npm start
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/app.db
    expose:
      - "3000"
    volumes:
      - backend_data:/data
      - backend_uploads:/app/uploads

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      DEFAULT_SNI: ${DEFAULT_SNI:-localhost}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  backend_data:
  caddy_data:
  caddy_config:
  backend_uploads: